[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "og"
version = "0.0.1"
description = "Own Ghost - A deamon that will observe your activities and help you make AI contexts from them"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [{ name = "Thor Whalen" }]
dependencies = [
    # Core dependencies (minimal)
    "dol>=0.2.38",    # Storage layer
    "i2>=0.1.20",     # Signature operations and wrapping
    "meshed>=0.1.20", # DAG composition and workflow assembly

    # AI dependencies
    "oa>=0.0.1",     # AI/LLM interface (preferred)
    "openai>=1.0.0", # Fallback for AI functionality

    # Embedding and vector search (for searchable history)
    "chromadb>=0.4.0",              # Vector database
    "sentence-transformers>=2.2.0", # Text embeddings
]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/og"
Repository = "https://github.com/thorwhalen/og"

[project.scripts]
og = "og.daemon:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]
observers = [
    # Third-party libraries the optional observers import lazily. Every one of
    # these is imported inside a method, never at module scope, so `import og`
    # works without them and each observer raises an informative ImportError
    # naming this extra.
    #
    # NOTE ON LICENCE: PyGithub's only licence signal is the classifier
    # "License :: OSI Approved :: GNU Library or Lesser General Public License
    # (LGPL)". og itself is MIT. Keeping it here rather than in the core
    # dependencies means `pip install og` pulls no copyleft distribution — see
    # [tool.wads.licence] below.
    "PyGithub>=2.0.0", # GitHub observer (LGPL - see [tool.wads.licence])
    "pynput>=1.7.6",   # Keyboard and mouse tracking
    "watchdog>=3.0.0", # File system monitoring
    "psutil>=5.9.0",   # Process and system monitoring
]
web = [
    # Web dashboard dependencies
    "flask>=3.0.0",
    "plotly>=5.0.0",
]
privacy = [
    # Privacy and encryption features
    "cryptography>=41.0.0",
]
integrations = [
    # Email and Calendar
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    # Slack
    "slack-sdk>=3.0.0",
    # Music tracking
    "spotipy>=2.23.0",
    "pylast>=5.0.0",
    # Export integrations
    "notion-client>=2.0.0",
]
all = [
    # All optional observers and features
    "PyGithub>=2.0.0",
    "pynput>=1.7.6",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    # Web dashboard
    "flask>=3.0.0",
    "plotly>=5.0.0",
    # Privacy features
    "cryptography>=41.0.0",
    # Integrations
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "slack-sdk>=3.0.0",
    "spotipy>=2.23.0",
    "pylast>=5.0.0",
    "notion-client>=2.0.0",
    # Platform-specific (Windows)
    "pywin32>=305; platform_system=='Windows'",
]
minimal = [
    # Minimal installation without heavy ML dependencies
    "dol>=0.2.38",
    "i2>=0.1.20",
    "meshed>=0.1.20",
    "openai>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

# --------------------------------------------------------------------------
# Licence adjudication
#
# og is MIT. The only non-permissive distribution it can pull is PyGithub,
# whose sole licence signal is an LGPL classifier (PyGithub 2.8.1 ships no
# License-Expression and an empty License field). It reaches a user only via
# an opt-in extra, never via `pip install og`. Recorded so the planned wads
# licence check reports "known, gated and accepted" rather than a violation,
# and so extras are checked rather than silently skipped.
# --------------------------------------------------------------------------
[tool.wads.licence]
# Written in the schema `wads-licence-check` actually reads (wads#71). The
# earlier hand-written shape here used `project_licence` / `allow`, which the
# tool rejects: `project_licence` restated `[project].license` as a second
# source of truth, and `allow` had no `deny` counterpart to pair with.
#
# `allowed` and `forbidden` are omitted on purpose. They REPLACE the shipped
# defaults rather than extending them, so the six-entry `allow` list this
# replaces was a narrowing: it dropped `Apache Software License` (which is what
# a free-text field usually says), HPND, Zlib, CC0, 0BSD and Unlicense, all of
# which are permissive, and all of which would have surfaced as UNCLASSIFIED
# noise. The defaults are the superset; add to them here only if something
# genuinely new turns up.
#
# Hard deps alone would report og as clean, which is correct and incomplete.
include-extras = ["observers", "all"]

[[tool.wads.licence.exceptions]]
dependency = "PyGithub"
licence = "LGPL (classifier only; no SPDX expression published)"
scope = "extra:observers, extra:all"
decided = "2026-08-30"
decided_in = "https://github.com/thorwhalen/og/issues/1"
reason = """
Gated, not accepted into core. PyGithub was declared as a hard dependency
next to a comment that called it optional; the comment was right and the
declaration was wrong. og/observers/github.py imports `github` inside
_get_github_client(), so nothing about `import og` needs it, and og's own
setup wizard already grouped it under "Observers" rather than "Core".

It now reaches a user only through `pip install "og[observers]"` (or
[all]) - a deliberate opt-in that the README names as LGPL. The GitHub
observer is one of a dozen interchangeable observers, so this is a real
choice for the user, not a fig leaf: og is fully usable without it.

No permissive replacement was sought because none is needed at this
distance. Revisit only if the GitHub observer ever moves back into the
core import path, or if og starts shipping frozen/bundled artifacts where
the LGPL relink freedom is no longer automatic.
"""

# --------------------------------------------------------------------------
# PyPI publishing is OFF, and this is a name collision, not a preference.
#
# The `og` name on PyPI is already taken by an UNRELATED package -- "Frequent
# itemsets -- fp-tree naeseth", homepage github.com/t-c-w/og, last released
# 0.0.5 in June 2025. Publishing from this repo would overwrite that project's
# name with this one's code.
#
# wads defaults `publish_enabled` to true, so without this table every merge to
# main uploads. That has been survived so far only by remembering to put
# `[skip ci]` in the merge title -- a ritual, which is to say a thing that gets
# forgotten exactly once. The guard belongs in the file.
#
# To publish this package: pick a name that is ours (`og` is not), rename
# `[project].name` to it, and flip this back to true.
# --------------------------------------------------------------------------
[tool.wads.ci.publish]
enabled = false
